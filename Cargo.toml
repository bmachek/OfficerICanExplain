[package]
name = "officer_i_can_explain"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "An original open-world crime sandbox"
publish = false

[features]
default = []
# Fast incremental iteration. Never enable for release builds.
dev = ["bevy/dynamic_linking"]
# Raytraced direct and indirect lighting, behind a feature because it pulls in
# BLAS building and forces the deferred path whether or not the GPU can run it.
raytracing = ["bevy/bevy_solari"]
# DLSS super resolution. Needs an NVIDIA GPU at runtime and the vendor SDK at
# build time, so it is never on by default.
dlss = ["bevy/dlss"]

[dependencies]
bevy = { version = "0.19", features = [
    "bevy_dev_tools",
    # `jpeg`: the scanned PBR sets under assets/materials are JPEG.
    "jpeg",
    # Percentage-closer soft shadows: a penumbra that widens with distance from
    # whatever cast it, instead of every shadow edge being equally hard.
    "experimental_pbr_pcss",
    # Blue noise for the screen-space reflection rays. Ships a texture; without
    # it the sampling pattern is white noise and rough reflections speckle.
    "bluenoise_texture",
    # `KeyCode` needs `Serialize`/`Deserialize` for the rebindable keymap in
    # `core::settings` to be written to `saves/options.ron`.
    "serialize",
] }
avian3d = "0.7"
leafwing-input-manager = "0.21"
bevy_egui = "0.42"
rand = "0.10"
rand_chacha = "0.10"
serde = { version = "1", features = ["derive"] }
ron = "0.12"

# Our own code: compile fast.
[profile.dev]
opt-level = 1

# Dependencies (physics especially): run fast.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
